<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory Rescue AI — API docs</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui.min.css">
<style>
  body { margin: 0; background: #fdfcf9; }
  .topbar { display: none; }
  .swagger-ui .info { margin: 28px 0; }
  .swagger-ui .info .title { color: #1a1d21; }
  .back {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px; padding: 16px 20px 0;
  }
  .back a { color: #2d6a4f; text-decoration: none; }
  .back a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="back"><a href="index.html">&larr; back to the app</a></div>

<div id="swagger"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui-bundle.min.js"></script>
<script>
window.onload = function () {
  SwaggerUIBundle({
    url: "openapi.json",
    dom_id: "#swagger",
    deepLinking: true,
    tryItOutEnabled: true,
    defaultModelsExpandDepth: -1,
    presets: [SwaggerUIBundle.presets.apis]
  });
};
</script>

</body>
</html>
