<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory Rescue AI</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --line: #e4e7eb;
    --text: #1a1d21;
    --muted: #6b7280;
    --brand: #2563eb;
    --good: #16a34a;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
    margin: 0; padding: 24px 16px; line-height: 1.5;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  header { margin-bottom: 24px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 15px; margin: 0; }
  nav { margin-top: 10px; font-size: 14px; }
  nav a { color: var(--brand); text-decoration: none; }
  nav a:hover { text-decoration: underline; }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 20px; margin-bottom: 20px;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }

  label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 5px; }
  input {
    width: 100%; padding: 9px 11px; font-size: 15px;
    border: 1px solid #cbd2d9; border-radius: 6px; background: #fff; color: var(--text);
  }
  input:focus { outline: 2px solid var(--brand); outline-offset: -1px; border-color: var(--brand); }

  button {
    margin-top: 18px; padding: 11px 22px; font-size: 15px; font-weight: 600;
    background: var(--brand); color: #fff; border: 0; border-radius: 6px; cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #9ca3af; cursor: not-allowed; }

  .note { padding: 14px 16px; border-radius: 8px; font-size: 14px; }
  .note.warn { background: #fef3c7; border: 1px solid #fcd34d; color: #78350f; }
  .note.err  { background: #fee2e2; border: 1px solid #fca5a5; color: #7f1d1d; }
  .note.info { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a5f; }
  .note code { background: rgba(0,0,0,.07); padding: 1px 5px; border-radius: 3px; }

  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th {
    text-align: left; padding: 9px 10px; background: #f3f4f6;
    font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted);
    border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  td { padding: 11px 10px; border-bottom: 1px solid #f0f1f3; vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  .score { font-weight: 700; color: var(--good); font-size: 16px; }
  .reasons { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .count { font-size: 14px; color: var(--muted); margin: 0 0 12px; }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 8px 0 20px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Inventory Rescue AI</h1>
    <p class="sub">Find other businesses that need your excess stock.</p>
    <nav><a href="docs.html">API documentation &rarr;</a></nav>
  </header>

  <div class="card">
    <form id="form">
      <div class="grid">
        <div>
          <label for="product_type">Product type</label>
          <input id="product_type" name="product_type" value="rice" required>
        </div>
        <div>
          <label for="quantity">Quantity available</label>
          <input id="quantity" name="quantity" type="number" min="1" value="500" required>
        </div>
        <div>
          <label for="price_per_unit">Price per unit (&#8377;)</label>
          <input id="price_per_unit" name="price_per_unit" type="number" min="0" step="0.01" value="40" required>
        </div>
        <div>
          <label for="city">Your city</label>
          <input id="city" name="city" value="Ludhiana" required>
        </div>
      </div>
      <button id="btn" type="submit">Find Buyers</button>
    </form>
  </div>

  <div id="output"></div>

  <footer>Inventory Rescue AI &middot; Supabase Edge Function + Vercel</footer>
</div>

<script>
// The API lives on the same domain, so this is just a relative path.
// No keys here - the serverless function holds them.
const API_URL = "/api/find-buyers";

const output = document.getElementById("output");
const btn = document.getElementById("btn");
const form = document.getElementById("form");

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

form.onsubmit = async function (e) {
  e.preventDefault();

  btn.disabled = true;
  btn.textContent = "Searching...";
  output.innerHTML = '<div class="note info">Looking for buyers...</div>';

  const body = {
    product_type: document.getElementById("product_type").value.trim(),
    quantity: Number(document.getElementById("quantity").value),
    price_per_unit: Number(document.getElementById("price_per_unit").value),
    city: document.getElementById("city").value.trim()
  };

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });

    const data = await res.json();

    if (!res.ok || data.error) {
      throw new Error(data.error || ("Server returned " + res.status));
    }

    if (!data.buyers || data.buyers.length === 0) {
      output.innerHTML =
        '<div class="note info">No buyers are currently looking for <b>' +
        esc(body.product_type) + '</b>. Try a different product type.</div>';
      return;
    }

    const rows = data.buyers.map(function (b) {
      return '<tr>' +
        '<td><b>' + esc(b.business_name) + '</b></td>' +
        '<td>' + esc(b.city) + '</td>' +
        '<td>' + esc(b.quantity_required) + '</td>' +
        '<td>&#8377;' + esc(b.max_price) + '</td>' +
        '<td><span class="score">' + esc(b.match_score) + '%</span>' +
          '<div class="reasons">' + b.reasons.map(esc).join(" &middot; ") + '</div></td>' +
        '<td>' + esc(b.contact_email) + '</td>' +
      '</tr>';
    }).join("");

    output.innerHTML =
      '<div class="card">' +
        '<p class="count"><b>' + data.count + '</b> potential buyer' +
        (data.count === 1 ? '' : 's') + ' found, best match first</p>' +
        '<div class="tablewrap"><table>' +
          '<tr><th>Business</th><th>City</th><th>Wants</th><th>Max price</th>' +
          '<th>Match</th><th>Contact</th></tr>' +
          rows +
        '</table></div>' +
      '</div>';

  } catch (err) {
    output.innerHTML =
      '<div class="note err"><b>Could not reach the API.</b><br>' + esc(err.message) +
      '<br><br>Check that <code>SUPABASE_URL</code> and <code>SUPABASE_SECRET_KEY</code> are set ' +
      'in Vercel under <b>Settings &rarr; Environment Variables</b>, and that you redeployed ' +
      'after adding them.</div>';
  } finally {
    btn.disabled = false;
    btn.textContent = "Find Buyers";
  }
};
</script>
</body>
</html>
